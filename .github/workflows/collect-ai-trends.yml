name: Collect AI Stars Trends

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: collect-ai-trends
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect AI stars snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.AI_TRENDS_TOKEN || github.token }}
        run: |
          python3 scripts/collect_ai_trends.py \
            --candidate-limit 200 \
            --max-search-requests 48 \
            --max-tracked 500

      - name: Commit updated trend data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_trends.json
          if git diff --cached --quiet; then
            echo "No trend data changes to commit."
          else
            git commit -m "Update AI stars trend data"
            git push
          fi
